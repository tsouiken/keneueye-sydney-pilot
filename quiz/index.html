<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>董事會遊戲 — KenEyeCue</title>
<meta name="description" content="7 個生活情境，看看現在你更常怎麼做決定；這是一個用來觀察自己反應模式的小遊戲。">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap">

  <!-- 進場引導 -->
  <section id="screen-intro" class="screen active">
    <div class="brand">KenEyeCue</div>
    <div style="height:32px"></div>
    <p class="kicker">董事會遊戲</p>
    <h1 class="serif">現在，<br>是誰在替你開會？</h1>
    <p class="lead">同一個人，不同情境，會啟動不同的決策模式。<br>用 7 關人生情境，看看誰在你腦內拍板。</p>

    <div class="how-card">
      <p><strong>怎麼玩</strong>：7 個情境，每關選一個你最像的反應。沒有對錯。</p>
      <p><strong>你會得到</strong>：誰在替你開會（權力分布）、四種決策傾向、一張可分享的結果卡。</p>
      <p><strong>先講清楚</strong>：這不是預測，只是把「你常怎麼反應」攤開給你看。</p>
    </div>

    <button id="btn-start" class="btn btn-gold">開始開會 →</button>
    <p class="fineprint">玩完可分享，結果僅供自我觀察。</p>
  </section>

  <!-- 作答 -->
  <section id="screen-quiz" class="screen">
    <div class="progress-row"><span id="q-num">1</span><span>/ 7</span></div>
    <div class="bar"><div id="bar-fill" class="bar-fill" style="width:14.2%"></div></div>

    <h2 id="q-text" class="serif"></h2>
    <div style="height:20px"></div>
    <div id="q-options"></div>

    <div class="quiz-actions">
      <button id="btn-back" class="btn btn-ghost">上一題</button>
      <button id="btn-next" class="btn" disabled>下一題</button>
    </div>

    <!-- 四血條：決策模式傾向 -->
    <div class="bars-mini">
      <div class="bar-mini"><span class="bar-mini-label">攻守</span><span class="bar-mini-track"><span class="bar-mini-fill" id="bar-B1"></span></span></div>
      <div class="bar-mini"><span class="bar-mini-label">內外</span><span class="bar-mini-track"><span class="bar-mini-fill" id="bar-B2"></span></span></div>
      <div class="bar-mini"><span class="bar-mini-label">剛柔</span><span class="bar-mini-track"><span class="bar-mini-fill" id="bar-B3"></span></span></div>
      <div class="bar-mini"><span class="bar-mini-label">快慢</span><span class="bar-mini-track"><span class="bar-mini-fill" id="bar-B4"></span></span></div>
    </div>
  </section>

</div>

<script src="quiz-data.js"></script>
<script src="quiz-logic.js"></script>
<script src="track.js"></script>
<script>
(function () {
  'use strict';
  var Q = QuizLogic.QUESTIONS;
  var answers = [];
  var step = 0;
  var selected = null;
  var MIN = -14, MAX = 14; // 血條顯示範圍：相對趨勢

  var screens = {
    intro: document.getElementById('screen-intro'),
    quiz: document.getElementById('screen-quiz')
  };

  function show(name) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle('active', k === name);
    });
    window.scrollTo(0, 0);
  }

  // 血條 = 已作答 + 目前選項 的累加值（未作答則歸零）
  function barsTotal() {
    var t = { B1: 0, B2: 0, B3: 0, B4: 0 };
    answers.forEach(function (key, i) {
      var q = Q[i];
      var opt = q.options.filter(function (o) { return o.key === key; })[0];
      var bars = opt && opt.bars;
      Object.keys(bars || {}).forEach(function (k) { t[k] += bars[k]; });
    });
    if (selected !== null) {
      var bars = Q[step].options[selected].bars || {};
      Object.keys(bars).forEach(function (k) { t[k] += bars[k]; });
    }
    return t;
  }

  function updateBars() {
    var t = barsTotal();
    Object.keys(t).forEach(function (k) {
      var fill = document.getElementById('bar-' + k);
      if (fill) fill.style.width = Math.max(4, Math.min(100, (t[k] - MIN) / (MAX - MIN) * 100)) + '%';
    });
  }

  function renderQuestion() {
    var q = Q[step];
    document.getElementById('q-num').textContent = step + 1;
    document.getElementById('bar-fill').style.width = ((step + 1) / Q.length * 100) + '%';
    document.getElementById('q-text').textContent = q.prompt;
    document.getElementById('btn-back').style.visibility = step === 0 ? 'hidden' : 'visible';
    document.getElementById('btn-next').disabled = true;
    selected = null;

    var box = document.getElementById('q-options');
    box.innerHTML = '';
    q.options.forEach(function (opt, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'option';
      b.textContent = opt.label;
      b.addEventListener('click', function () { selectOption(i); });
      box.appendChild(b);
    });
    updateBars();
  }

  function selectOption(i) {
    selected = i;
    var opts = document.querySelectorAll('#q-options .option');
    opts.forEach(function (el, idx) { el.classList.toggle('selected', idx === i); });
    document.getElementById('btn-next').disabled = false;
    updateBars();
  }

  function finish() {
    // 答案已在 answers 中（btn-next handler 已 push），直接計分
    var r = QuizLogic.run(answers);
    try {
      localStorage.setItem('zw_result', JSON.stringify(r));
      localStorage.setItem('zw_answers', JSON.stringify(answers));
    } catch (_) {}
    track('finish');
    location.href = 'result.html';
  }

  document.getElementById('btn-start').addEventListener('click', function () {
    step = 0; answers = []; selected = null;
    renderQuestion();
    show('quiz');
  });

  document.getElementById('btn-next').addEventListener('click', function () {
    if (selected === null) return;
    answers.push(Q[step].options[selected].key);
    step += 1;
    if (step >= Q.length) { finish(); return; }
    renderQuestion();
  });

  document.getElementById('btn-back').addEventListener('click', function () {
    if (step === 0) return;
    step -= 1; answers.pop(); renderQuestion();
  });
})();
</script>
</body>
</html>
