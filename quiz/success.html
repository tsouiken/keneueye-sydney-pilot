<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>付款完成 — KenEyeCue</title>
<meta name="description" content="付款完成，完整報告已解鎖。">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap">

  <div class="brand">KenEyeCue</div>

  <div id="status" class="status-box">
    <div class="status-icon wait" id="status-icon">…</div>
    <h1 class="serif" id="status-title">確認付款中</h1>
    <p id="status-desc" class="lead" style="margin-bottom:0">請稍候…</p>
    <p class="order-id" id="order-line" style="display:none">案件編號：<span id="order-id"></span></p>
  </div>

  <a id="btn-report" class="btn btn-gold" style="display:none">看完整報告</a>

  <div id="atm-box" style="display:none">
    <div class="result-note">
      <strong>ATM 待付款</strong><br>
      銀行代碼：<span id="atm-bank"></span><br>
      虛擬帳號：<span id="atm-account"></span><br>
      繳費期限：<span id="atm-expire"></span>
    </div>
    <p class="fineprint">入帳後完整報告會自動解鎖，這一頁重新整理就看得到。</p>
  </div>

  <p class="fineprint">測驗與報告僅供參考，不構成任何保證。</p>

</div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var orderId = params.get('order') || '';
  var token = params.get('t') || '';

  var icon = document.getElementById('status-icon');
  var title = document.getElementById('status-title');
  var desc = document.getElementById('status-desc');
  var btnReport = document.getElementById('btn-report');

  if (!orderId) {
    title.textContent = '案件編號遺失';
    desc.textContent = '請用當初收到的完整連結開啟。';
    return;
  }

  document.getElementById('order-id').textContent = orderId;
  document.getElementById('order-line').style.display = 'block';

  fetch('/api/order/' + encodeURIComponent(orderId))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.status === 'paid') {
        icon.className = 'status-icon ok';
        icon.textContent = '✓';
        title.textContent = '付款完成';
        desc.textContent = '完整報告已經解鎖了。';
        if (token) {
          btnReport.href = 'report.html?order=' + encodeURIComponent(orderId) + '&t=' + encodeURIComponent(token);
          btnReport.style.display = 'block';
        } else {
          desc.textContent = '完整報告已解鎖，請用當初收到的報告連結開啟。';
        }
        return;
      }

      if (d.status === 'atm_pending') {
        title.textContent = 'ATM 待付款';
        desc.textContent = '轉帳完成後，完整報告會自動解鎖。';
        document.getElementById('atm-box').style.display = 'block';
        return;
      }

      title.textContent = '尚未收到付款';
      desc.textContent = '如果你剛完成付款，稍等一下再重新整理這一頁。';
    })
    .catch(function () {
      title.textContent = '查詢失敗';
      desc.textContent = '請稍後重新整理這一頁。';
    });
})();
</script>
</body>
</html>
