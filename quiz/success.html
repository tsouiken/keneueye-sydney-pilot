<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>付款完成 — KenEyeCue</title>
<meta name="description" content="付款完成，完整報告已解鎖。">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap">

  <div class="brand">KenEyeCue</div>

  <div id="status" class="status-box">
    <div class="status-icon wait" id="status-icon">…</div>
    <h1 class="serif" id="status-title">確認付款中</h1>
    <p id="status-desc" class="lead" style="margin-bottom:0">請稍候…</p>
    <p class="order-id" id="order-line" style="display:none">案件編號：<span id="order-id"></span></p>
  </div>

  <a id="btn-report" class="btn btn-gold" style="display:none">看完整報告</a>

  <div id="atm-box" style="display:none">
    <div class="result-note">
      <strong>ATM 待付款</strong><br>
      銀行代碼：<span id="atm-bank"></span><br>
      虛擬帳號：<span id="atm-account"></span><br>
      繳費期限：<span id="atm-expire"></span>
    </div>
    <p class="fineprint">入帳後完整報告會自動解鎖，這一頁重新整理就看得到。</p>
  </div>

  <p class="fineprint">測驗與報告僅供個人參考，請依自己的實際情況判斷。</p>

</div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var orderId = params.get('order') || '';
  var token = params.get('token') || '';

  var icon = document.getElementById('status-icon');
  var title = document.getElementById('status-title');
  var desc = document.getElementById('status-desc');
  var btnReport = document.getElementById('btn-report');

  if (!orderId) {
    title.textContent = '案件編號遺失';
    desc.textContent = '請用當初收到的完整連結開啟。';
    return;
  }

  document.getElementById('order-id').textContent = orderId;
  document.getElementById('order-line').style.display = 'block';

  // 單一查詢路徑。token 上線前的舊訂單沒有 token，憑訂單號就能查（伺服器端
  // orderAuthorized 放行）；新訂單沒帶 token 會是 404，那就明講要用完整連結。
  var lookup = '/api/report?order=' + encodeURIComponent(orderId) + '&token=' + encodeURIComponent(token);
  var reportHref = 'report.html?order=' + encodeURIComponent(orderId) + (token ? '&token=' + encodeURIComponent(token) : '');

  // 綠界可能比它自己的付款通知還早把人導回這一頁，
  // 只查一次就會停在「尚未收到付款」不動。所以要輪詢等通知進來。
  var MAX_TRIES = 10;
  var INTERVAL_MS = 3000;
  // 拿到虛擬帳號之後不能停止查詢：轉帳可能是幾分鐘也可能是幾小時之後，
  // 而頁面上寫著「入帳後自動解鎖」。停掉就變成頁面一直卡在「ATM 待付款」，
  // 客人得自己重新整理才看得到報告。改成慢速續查，頁面開著就一直等。
  var ATM_INTERVAL_MS = 15000;
  var tries = 0;
  var atmWatching = false;

  function renderPaid() {
    icon.className = 'status-icon ok';
    icon.textContent = '✓';
    title.textContent = '付款完成';
    desc.textContent = '完整報告已經解鎖了。';
    btnReport.href = reportHref;
    btnReport.style.display = 'block';
  }

  function notFound() {
    title.textContent = '找不到這個案件';
    desc.textContent = '請用付款後的完整連結開啟（網址要帶存取碼）。';
  }

  function renderAtm(d) {
    title.textContent = 'ATM 待付款';
    if (d.vAccount) {
      desc.textContent = '用下面的虛擬帳號轉帳，入帳後完整報告會自動解鎖。';
      document.getElementById('atm-bank').textContent = d.bankCode || '—';
      document.getElementById('atm-account').textContent = d.vAccount;
      document.getElementById('atm-expire').textContent = d.expireDate || '—';
      document.getElementById('atm-box').style.display = 'block';
    } else {
      // 沒帶 token 或還沒拿到帳號：不要顯示空白欄位騙人
      desc.textContent = '請用當初收到的完整連結開啟，才看得到轉帳用的虛擬帳號。';
    }
  }

  function giveUp() {
    title.textContent = '尚未收到付款';
    desc.textContent = '如果你剛完成付款，銀行端可能還在處理。稍等一下再重新整理這一頁。';
  }

  // 慢速續查：只認「付款完成」，其餘一律再等。查詢失敗也繼續，
  // 因為網路斷一下不代表這筆沒了。tries 不再累加，MAX_TRIES 管不到這裡。
  function watchAtm() {
    if (atmWatching) return;
    atmWatching = true;
    (function loop() {
      setTimeout(function () {
        fetch(lookup)
          .then(function (r) { return r.status === 404 ? null : r.json(); })
          .then(function (d) {
            if (d && d.status === 'paid') return renderPaid();
            loop();
          })
          .catch(loop);
      }, ATM_INTERVAL_MS);
    })();
  }

  function poll() {
    tries += 1;
    fetch(lookup)
      .then(function (r) {
        if (r.status === 404) return null;
        return r.json();
      })
      .then(function (d) {
        if (d === null) return notFound();
        if (d.status === 'paid') return renderPaid();
        if (d.status === 'atm_pending' && d.vAccount) {
          renderAtm(d);
          return watchAtm();
        }

        if (tries >= MAX_TRIES) {
          // ATM 但一直沒拿到帳號，也是要講清楚，不能停在「確認付款中」
          if (d.status === 'atm_pending') return renderAtm(d);
          return giveUp();
        }
        desc.textContent = '正在跟金流確認，請稍候…';
        setTimeout(poll, INTERVAL_MS);
      })
      .catch(function () {
        if (tries >= MAX_TRIES) {
          title.textContent = '查詢失敗';
          desc.textContent = '請稍後重新整理這一頁。';
          return;
        }
        setTimeout(poll, INTERVAL_MS);
      });
  }

  poll();
})();
</script>
</body>
</html>
