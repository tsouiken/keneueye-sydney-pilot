<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KenEyeCue 雪梨 · 报名登记</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fafaf5; color: #1a1a1a; line-height: 1.7; padding: 40px 20px; }
.container { max-width: 600px; margin: 0 auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 32px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
.form-group { margin-bottom: 20px; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; font-family: inherit; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #1a1a1a; }
textarea { resize: vertical; min-height: 80px; }
.radio-group { margin: 8px 0; }
.radio-group label { font-weight: 400; display: inline; margin-left: 6px; }
.radio-item { margin: 6px 0; }
.btn { width: 100%; padding: 14px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; }
.btn:hover { background: #333; }
.note { font-size: 12px; color: #999; margin-top: 16px; text-align: center; }
hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
.price-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 12px 0; }
.price-table th { text-align: left; padding: 8px 10px; background: #f5f5f0; border-bottom: 1px solid #e5e5e5; font-weight: 600; }
.price-table td { padding: 8px 10px; border-bottom: 1px solid #e5e5e5; }
</style>
</head>
<body>
<div class="container">

<h1>KenEyeCue 雪梨 · 报名登记</h1>
<p class="subtitle">填写后 Bonnie 会与你联系确认梯次与付款</p>

<form id="enrollForm">

<div class="form-group">
<label>姓名 *</label>
<input type="text" name="name" required placeholder="你的姓名">
</div>

<div class="form-group">
<label>微信 / LINE</label>
<input type="text" name="contact" placeholder="你的联系方式">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" placeholder="your@email.com">
</div>

<div class="form-group">
<label>电话</label>
<input type="tel" name="phone" placeholder="可选">
</div>

<hr>

<div class="form-group">
<label>你想报名哪个场次？ *</label>
<select name="session" required>
<option value="">请选择</option>
<option value="free">免费说明会 8/27（四）14:00-17:00 — 免费</option>
<option value="l1-sep">L1 入门工作坊 9/12（六）14:00-17:00 — AUD $150</option>
<option value="l2-sep">L2 实战班 9/26（六）10:00-16:00 — AUD $350</option>
<option value="l1-oct">L1 入门工作坊 10/10（六）14:00-17:00 — AUD $150</option>
<option value="l3">L3 闭门会 10/24（六）10:00-16:00 — AUD $800</option>
<option value="l2-nov">L2 实战班 11/7（六）10:00-16:00 — AUD $350</option>
<option value="unsure">还不确定，想先了解</option>
</select>
</div>

<div class="form-group">
<label>你目前从事什么行业？</label>
<input type="text" name="industry" placeholder="例如：美业、形象顾问、其他">
</div>

<div class="form-group">
<label>你为什么对这个课程感兴趣？</label>
<textarea name="reason" placeholder="简单说一下你的想法"></textarea>
</div>

<hr>

<div class="form-group">
<label>意向金 AUD $100（可全额退费）</label>
<p style="font-size:13px;color:#666;margin-bottom:8px;">
先付 $100 意向金保留名额。如果最后决定不来，全额退费。完全没有风险。
</p>
<div class="radio-group">
<div class="radio-item"><input type="radio" name="deposit" value="yes" id="dep-yes"> <label for="dep-yes">我愿意付意向金 $100 保留名额</label></div>
<div class="radio-item"><input type="radio" name="deposit" value="no" id="dep-no"> <label for="dep-no">我先了解，之后再决定</label></div>
</div>
</div>

<div class="form-group">
<label>备注</label>
<textarea name="notes" placeholder="有任何问题或特殊需求，请在这里写"></textarea>
</div>

<button type="submit" class="btn">提交登记</button>

<p class="note">
提交后 Bonnie 会在 48 小时内与你联系。<br>
你的资料仅用于本次课程报名，不会用于其他用途。
</p>

</form>

</div>

<script>
document.getElementById('enrollForm').addEventListener('submit', function(e) {
e.preventDefault();
var formData = new FormData(this);
var data = {};
formData.forEach(function(v, k) { data[k] = v; });

// Format the message for Bonnie
var msg = '📋 新报名登记\n';
msg += '姓名：' + (data.name || '未填') + '\n';
msg += '联系方式：' + (data.contact || '未填') + '\n';
msg += 'Email：' + (data.email || '未填') + '\n';
msg += '电话：' + (data.phone || '未填') + '\n';
msg += '报名场次：' + (data.session || '未选') + '\n';
msg += '行业：' + (data.industry || '未填') + '\n';
msg += '兴趣原因：' + (data.reason || '未填') + '\n';
msg += '意向金：' + (data.deposit === 'yes' ? '愿意付 $100' : '先了解') + '\n';
msg += '备注：' + (data.notes || '无');

// Show confirmation
var btn = document.querySelector('.btn');
btn.textContent = '✅ 已提交！Bonnie 会联系你';
btn.style.background = '#1a1a1a';
btn.disabled = true;

// Create a copyable message
var resultDiv = document.createElement('div');
resultDiv.style.cssText = 'margin-top:20px;padding:16px;background:#f5f5f0;border-radius:6px;font-size:13px;white-space:pre-wrap;word-break:break-all;';
resultDiv.textContent = msg;

var copyBtn = document.createElement('button');
copyBtn.textContent = '复制信息发给 Bonnie';
copyBtn.style.cssText = 'margin-top:8px;padding:8px 16px;background:#fff;border:1px solid #1a1a1a;border-radius:4px;cursor:pointer;font-size:13px;width:100%;';
copyBtn.onclick = function() {
navigator.clipboard.writeText(msg).then(function() {
copyBtn.textContent = '✅ 已复制';
}).catch(function() {
copyBtn.textContent = '复制失败，请手动复制上方文字';
});
};

document.querySelector('.container').appendChild(resultDiv);
document.querySelector('.container').appendChild(copyBtn);
});
</script>

</body>
</html>
